name: Tests

on:
  pull_request:
  push:
    branches: [main]

# Supersede older runs of the same PR; keep every run on main so each merged
# commit gets a verdict.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Lint, build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci

      # Later steps still run when an earlier check fails, so one run reports
      # every red reason at once. They are skipped only if the install failed.
      - name: Lint (Biome)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Type-check and build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build

      - name: Unit tests (Vitest)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx vitest run
